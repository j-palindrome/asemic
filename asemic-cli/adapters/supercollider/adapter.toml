[adapter]
name = "supercollider"
kind = "process"
description = "sclang boots scsynth; asemic/out/supercollider/set/<name> -> Synth(\\asemicVoice).set; /def /nset /free -> Ndef rows from sc(); asemic/io/supercollider/* <- OSC"

[lifecycle]
start = "/Applications/SuperCollider.app/Contents/MacOS/sclang -u 57120 boot.scd"
# Scoped process management: the brain's adapter host logs the started pid, spawns it
# in its own process group (`process_group(0)`), and cleanly signals `-<pid>` on stop.
# Never run machine-wide `pkill -x` so other SuperCollider processes are never disturbed.

[osc]
listen = 57130          # sclang -> brain (asemic/io/supercollider/*)
send = "127.0.0.1:57120" # brain -> sclang
