[package]
name = "asemic-font"
edition.workspace = true
version.workspace = true

[dependencies]
glam = "0.32"
lyon_path = "1"
anyhow.workspace = true
tracing.workspace = true
harfrust = "0.14"
skrifa = "0.48"
notify = "8"
noise = "0.9"
rand = "0.10"
bytemuck = { version = "1", features = ["derive"], optional = true }
wgpu = { version = "30", optional = true }
wesl = { version = "0.6", optional = true }

[features]
gpu = ["dep:wgpu", "dep:wesl", "dep:bytemuck", "glam/bytemuck"]

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
