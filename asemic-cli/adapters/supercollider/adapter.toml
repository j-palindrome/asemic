[adapter]
name = "supercollider"
kind = "process"
description = "sclang boots scsynth; asemic/out/supercollider/set/<name> -> Synth(\\asemicVoice).set; /def /nset /free -> Ndef rows from sc(); asemic/io/supercollider/* <- OSC"

[lifecycle]
start = "/Applications/SuperCollider.app/Contents/MacOS/sclang boot.scd"
stop = "pkill -9 -P $PPID sclang scsynth 2>/dev/null || pkill -9 -x scsynth sclang 2>/dev/null || true"
# Brain's adapter host starts every process in its own process group and signals that group on stop.
# An explicit stop script ensures no detached scsynth or orphan sclang workers linger.

[osc]
listen = 57130          # sclang -> brain (asemic/io/supercollider/*)
send = "127.0.0.1:57120" # brain -> sclang
